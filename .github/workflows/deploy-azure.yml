name: Deploy to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: azure-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build web client and SSR bundle
        run: npm run build
        env:
          VITE_API_URL: /api/v1

      - name: Prune devDependencies and keep tsx for API runtime
        run: |
          npm prune --omit=dev
          npm install --no-save tsx@4.19.2

      - name: Materialize workspace @hvac/shared into node_modules
        run: |
          rm -rf node_modules/@hvac/shared
          mkdir -p node_modules/@hvac
          cp -r packages/shared node_modules/@hvac/shared

      - name: Package API artifact
        run: |
          zip -rqy api-package.zip \
            package.json \
            package-lock.json \
            packages/shared \
            apps/api/package.json \
            apps/api/tsconfig.json \
            apps/api/src \
            node_modules

      - name: Package Web artifact
        run: |
          zip -rqy web-package.zip \
            package.json \
            package-lock.json \
            packages/shared \
            apps/web/package.json \
            apps/web/server.mjs \
            apps/web/dist \
            node_modules

      - uses: actions/upload-artifact@v4
        with:
          name: api-package
          path: api-package.zip
          retention-days: 1

      - uses: actions/upload-artifact@v4
        with:
          name: web-package
          path: web-package.zip
          retention-days: 1

  deploy-api:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: api-package

      - name: Deploy API to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_API_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_API_PUBLISH_PROFILE }}
          package: api-package.zip

  deploy-web:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web-package

      - name: Deploy Web to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_WEB_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_WEB_PUBLISH_PROFILE }}
          package: web-package.zip
